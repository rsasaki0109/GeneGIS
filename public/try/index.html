<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeneGIS in your browser</title>
<meta name="description" content="Drop your data, ask in plain language, get a verified map. GeneGIS runs entirely in the page — your data never leaves it.">
<meta property="og:title" content="GeneGIS in your browser">
<meta property="og:description" content="Drop your data, ask in plain language, get a verified map. No server — your data never leaves the page.">
<meta property="og:image" content="../og.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #050a16; --panel: #0b1222; --line: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --ok: #34d399; --ok-bg: #0f5132; --bad: #f87171; --bad-bg: #450a0a; --warn: #fcd34d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--accent); }
  .privacy { border: 1px solid var(--ok); background: var(--ok-bg); color: #ecfdf5; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
  header a { color: var(--muted); margin-left: auto; font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: calc(100vh - 62px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; }
  section { margin-bottom: 18px; }
  h2 { font-size: 13px; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 700; }
  button:disabled { opacity: .5; cursor: progress; }
  .drop { margin-top: 8px; border: 1.5px dashed #334155; border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); color: var(--text); }
  ul.layers { list-style: none; margin: 10px 0 0; padding: 0; }
  ul.layers li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; background: var(--panel); margin-bottom: 4px; font-size: 13px; }
  ul.layers li small { color: var(--muted); white-space: nowrap; }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--panel); color: var(--text); border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; font: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chips button { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }
  .card.bad { border-color: var(--bad); background: var(--bad-bg); }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: 12.5px; }
  .badge.ok { background: var(--ok-bg); border: 1px solid var(--ok); color: #ecfdf5; }
  .step { margin-top: 8px; }
  .step code { color: var(--warn); }
  .check { font-size: 12.5px; margin-left: 4px; }
  .check.pass::before { content: "✓ "; color: var(--ok); font-weight: 700; }
  .check.fail::before { content: "✗ "; color: var(--bad); font-weight: 700; }
  .mono { font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #map { width: 100%; height: 100%; }
  .right { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  .table { max-height: 34vh; overflow: auto; border-top: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); }
  .status { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .right { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>GeneGIS <span>in your browser</span></h1>
  <div class="privacy">🔒 サーバーなし — データはこのページから出ません</div>
  <a href="https://github.com/rsasaki0109/GeneGIS">GitHub ↗</a>
</header>
<main>
  <aside>
    <section>
      <h2>1 · データ</h2>
      <button id="samples">名古屋のサンプルを読み込む</button>
      <div class="drop" id="drop">GeoJSON / CSV（lon,lat か WKT）/ zip の Shapefile をドロップ<br><small>または <label style="color:var(--accent);cursor:pointer"><input type="file" id="file" multiple hidden>ファイルを選ぶ</label></small></div>
      <ul class="layers" id="layers"></ul>
    </section>
    <section>
      <h2>2 · 質問</h2>
      <textarea id="question" placeholder="例: 駅から500m以内の避難所を数えて"></textarea>
      <div class="chips" id="chips"></div>
      <button class="primary" id="ask">検証つきで実行</button>
      <div class="status" id="status">エンジンを読み込み中…</div>
    </section>
    <section>
      <h2>3 · 結果と根拠</h2>
      <div id="result"><div class="status">質問すると、実行した手順・各ステップの独立チェック・ダイジェストがここに出ます。チェックが1つでも落ちたら答えは返しません。</div></div>
    </section>
  </aside>
  <div class="right">
    <div id="map"></div>
    <div class="table" id="table"></div>
  </div>
</main>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
