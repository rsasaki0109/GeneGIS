[package]
name = "genegis-workbench"
description = "GeneGIS local web workbench (Tauri-free desktop MVP launcher)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "genegis-workbench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
genegis-analysis = { path = "../../crates/genegis-analysis" }
genegis-adapter = { path = "../../crates/genegis-adapter" }
genegis-agent = { path = "../../crates/genegis-agent" }
genegis-ai = { path = "../../crates/genegis-ai" }
genegis-catalog = { path = "../../crates/genegis-catalog" }
genegis-capsule = { path = "../../crates/genegis-capsule" }
genegis-collab = { path = "../../crates/genegis-collab" }
genegis-core = { path = "../../crates/genegis-core" }
genegis-crs = { path = "../../crates/genegis-crs" }
genegis-plugin-host = { path = "../../crates/genegis-plugin-host" }
genegis-render = { path = "../../crates/genegis-render" }
genegis-storage = { path = "../../crates/genegis-storage" }
genegis-vector = { path = "../../crates/genegis-vector" }
genegis-workflow = { path = "../../crates/genegis-workflow" }
open = "5"
serde = { workspace = true }
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid.workspace = true
