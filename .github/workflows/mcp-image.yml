name: MCP server image

# Pull requests: build the genegis-mcp image and smoke-test it over stdio.
# Tags `mcp-v<version>`: also push it to GHCR and publish server.json to the
# official MCP Registry (ownership is proven by the image label and OIDC).

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/mcp/**
      - crates/**
      - Cargo.lock
      - Cargo.toml
      - server.json
      - .dockerignore
      - .github/workflows/mcp-image.yml
  push:
    tags: ["mcp-v*"]

env:
  IMAGE: ghcr.io/rsasaki0109/genegis-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC login to the MCP Registry
    steps:
      - uses: actions/checkout@v4

      - name: Check server.json version against the tag
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          version="$(jq -r .version server.json)"
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          test "mcp-v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "server.json version ${version} does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          test "${identifier}" = "${IMAGE}:${version}" \
            || { echo "server.json identifier ${identifier} is not ${IMAGE}:${version}"; exit 1; }

      - name: Build image
        run: docker build -f deploy/mcp/Dockerfile -t genegis-mcp:ci .

      - name: Smoke-test MCP over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"load_sample_data","arguments":{}}}' \
            | timeout 120 docker run -i --rm genegis-mcp:ci > mcp-out.jsonl
          jq -e 'select(.id == 1) | .result.serverInfo.name == "genegis"' mcp-out.jsonl
          jq -e 'select(.id == 2) | [.result.tools[].name] | index("run_plan") != null' mcp-out.jsonl
          jq -e 'select(.id == 3) | .result.isError != true' mcp-out.jsonl

      - name: Check ownership label
        run: |
          label="$(docker inspect -f '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' genegis-mcp:ci)"
          test "${label}" = "$(jq -r .name server.json)"

      - name: Push to GHCR
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          version="$(jq -r .version server.json)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag genegis-mcp:ci "${IMAGE}:${version}"
          docker tag genegis-mcp:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${version}"
          docker push "${IMAGE}:latest"

      - name: Install mcp-publisher
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
