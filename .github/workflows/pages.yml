name: Browser demo (GitHub Pages)

# Builds GeneGIS for the browser and publishes public/try to
# https://rsasaki0109.github.io/GeneGIS/try/ (Settings → Pages → Source:
# GitHub Actions must be enabled once).

on:
  push:
    branches: [main]
    paths:
      - public/try/**
      - public/og.png
      - crates/genegis-wasm/**
      - crates/genegis-toolkit/**
      - crates/genegis-core/**
      - crates/genegis-crs/**
      - crates/genegis-workflow/**
      - examples/nagoya-population-density/data/**
      - Cargo.lock
      - scripts/build-wasm.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: Build the browser bundle
        run: bash scripts/build-wasm.sh
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r public/try site/try
          cp public/og.png site/og.png
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=try/"><a href="try/">GeneGIS in your browser</a>\n' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}try/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
